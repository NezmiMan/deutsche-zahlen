<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deutsche Zahlen Lernen | ドイツ語数字練習</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0d0d1a;
      --card: #1a1a2e;
      --card2: #16213e;
      --accent: #7c6fff;
      --accent2: #ff6b9d;
      --text: #dde0ff;
      --muted: #7a7fa8;
      --correct: #4ade80;
      --wrong: #f87171;
      --missing: #facc15;
      --gold: #fbbf24;
      --silver: #94a3b8;
      --bronze: #c2692a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .screen { width: 100%; max-width: 620px; }
    .hidden { display: none !important; }

    /* ── Header shared ── */
    .header { text-align: center; margin-bottom: 28px; }
    .header h1 {
      font-size: 2rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 4px;
    }
    .header p { color: var(--muted); font-size: 0.9rem; }

    /* ── Card ── */
    .card {
      background: var(--card);
      border-radius: 24px;
      padding: 36px 32px;
      border: 1px solid rgba(255,255,255,0.07);
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      margin-bottom: 16px;
    }

    /* ── Name screen ── */
    .name-label {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 10px;
      display: block;
    }
    .name-input {
      width: 100%;
      padding: 16px 20px;
      background: rgba(255,255,255,0.05);
      border: 2px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      color: #fff;
      font-size: 1.2rem;
      font-weight: 600;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 20px;
      text-align: center;
    }
    .name-input:focus { border-color: var(--accent); }
    .name-note { font-size: 0.78rem; color: var(--muted); text-align: center; margin-bottom: 20px; }

    /* ── Score bar ── */
    .score-bar {
      display: flex;
      justify-content: space-around;
      background: var(--card);
      border-radius: 16px;
      padding: 12px 16px;
      margin-bottom: 16px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .score-item { text-align: center; }
    .score-label { font-size: 0.72rem; color: var(--muted); margin-bottom: 3px; }
    .score-value { font-size: 1.4rem; font-weight: 700; }
    .sv-correct { color: var(--correct); }
    .sv-rate    { color: var(--accent); }
    .sv-wrong   { color: var(--wrong); }

    /* ── Game screen top bar ── */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .player-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 0.9rem;
    }
    .player-badge span { color: var(--muted); font-size: 0.75rem; }
    .rank-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: rgba(124,111,255,0.12);
      border: 1px solid rgba(124,111,255,0.3);
      border-radius: 999px;
      color: var(--accent);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .rank-btn:hover { background: rgba(124,111,255,0.22); }

    /* ── Number display ── */
    .number-display {
      text-align: center;
      font-size: 5.5rem;
      font-weight: 900;
      color: #fff;
      letter-spacing: -3px;
      line-height: 1;
      margin-bottom: 4px;
      text-shadow: 0 0 40px rgba(124,111,255,0.3);
    }
    .number-hint { text-align: center; font-size: 0.85rem; color: var(--muted); margin-bottom: 24px; }

    /* ── Speak button ── */
    .speak-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 11px;
      background: rgba(124,111,255,0.1);
      border: 1px solid rgba(124,111,255,0.3);
      border-radius: 12px;
      color: var(--accent);
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 20px;
    }
    .speak-btn:hover { background: rgba(124,111,255,0.2); }
    .speak-btn.speaking { animation: pulse 0.9s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

    /* ── Answer input ── */
    .answer-input {
      width: 100%;
      padding: 15px 18px;
      background: rgba(255,255,255,0.05);
      border: 2px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      color: #fff;
      font-size: 1.1rem;
      font-family: 'Courier New', monospace;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 10px;
    }
    .answer-input:focus { border-color: var(--accent); }
    .answer-input:disabled { opacity: 0.6; cursor: not-allowed; }

    /* ── Umlaut / Hint row ── */
    .umlaut-row { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; }
    .umlaut-bar { display: flex; gap: 8px; flex-wrap: wrap; }
    .umlaut-btn {
      padding: 6px 16px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.15s;
      font-family: 'Courier New', monospace;
    }
    .umlaut-btn:hover { background: rgba(255,255,255,0.16); }
    .hint-btn {
      padding: 6px 14px;
      background: rgba(250,204,21,0.08);
      border: 1px solid rgba(250,204,21,0.25);
      border-radius: 8px;
      color: var(--missing);
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.15s;
      margin-left: auto;
      white-space: nowrap;
    }
    .hint-btn:hover { background: rgba(250,204,21,0.16); }

    /* ── Buttons ── */
    .btn-primary {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #7c6fff, #a855f7);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(124,111,255,0.45);
    }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

    .btn-next {
      width: 100%;
      padding: 15px;
      background: rgba(74,222,128,0.1);
      border: 1px solid rgba(74,222,128,0.35);
      border-radius: 12px;
      color: var(--correct);
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 12px;
    }
    .btn-next:hover { background: rgba(74,222,128,0.2); }

    /* ── Result card ── */
    .result-card {
      background: var(--card2);
      border-radius: 18px;
      padding: 24px;
      border: 1px solid rgba(255,255,255,0.07);
      animation: slideIn 0.3s ease;
      margin-bottom: 0;
    }
    @keyframes slideIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    .result-status { font-size: 1.15rem; font-weight: 700; text-align: center; margin-bottom: 18px; }
    .rs-correct { color: var(--correct); }
    .rs-wrong   { color: var(--wrong); }

    .comparison-label { font-size: 0.75rem; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.8px; }
    .comparison {
      font-family: 'Courier New', monospace;
      font-size: 1.15rem;
      line-height: 1.8;
      word-break: break-all;
      background: rgba(0,0,0,0.2);
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 14px;
      min-height: 48px;
    }
    .ch-ok   { color: var(--correct); }
    .ch-bad  { color: var(--wrong); border-bottom: 2px solid var(--wrong); }
    .ch-miss { color: var(--missing); border-bottom: 2px dashed var(--missing); }

    .correct-box { padding: 12px 16px; background: rgba(74,222,128,0.07); border-left: 3px solid var(--correct); border-radius: 0 10px 10px 0; }
    .correct-box-label { font-size: 0.75rem; color: var(--muted); margin-bottom: 4px; }
    .correct-box-text { font-family: 'Courier New', monospace; font-size: 1.1rem; color: var(--correct); font-weight: 600; }

    .legend { display: flex; gap: 16px; font-size: 0.78rem; color: var(--muted); margin-top: 12px; flex-wrap: wrap; }
    .legend span { display: flex; align-items: center; gap: 4px; }
    .leg-ok   { color: var(--correct); font-weight: 700; }
    .leg-bad  { color: var(--wrong); font-weight: 700; }
    .leg-miss { color: var(--missing); font-weight: 700; }

    /* ── Sync indicator ── */
    .sync-note {
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 10px;
      height: 16px;
    }
    .sync-note.saving { color: var(--accent); }
    .sync-note.saved  { color: var(--correct); }
    .sync-note.error  { color: var(--wrong); }

    /* ── Leaderboard screen ── */
    .lb-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .lb-header h2 { font-size: 1.4rem; font-weight: 800; }
    .lb-actions { display: flex; gap: 8px; }
    .btn-icon {
      padding: 8px 14px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      color: var(--text);
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-icon:hover { background: rgba(255,255,255,0.14); }

    .lb-table { width: 100%; border-collapse: collapse; }
    .lb-table th {
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      padding: 8px 12px;
      text-align: left;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .lb-table th:last-child, .lb-table td:last-child { text-align: right; }
    .lb-table td {
      padding: 12px 12px;
      font-size: 0.95rem;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      vertical-align: middle;
    }
    .lb-table tr:last-child td { border-bottom: none; }
    .lb-table tr.me td { background: rgba(124,111,255,0.08); }

    .rank-cell { font-weight: 700; font-size: 1rem; width: 36px; text-align: center; }
    .medal-1 { color: var(--gold); }
    .medal-2 { color: var(--silver); }
    .medal-3 { color: var(--bronze); }

    .name-cell { font-weight: 600; }
    .correct-cell { color: var(--correct); font-weight: 700; font-variant-numeric: tabular-nums; }
    .rate-cell { color: var(--accent); font-variant-numeric: tabular-nums; }
    .total-cell { color: var(--muted); font-variant-numeric: tabular-nums; }

    .lb-empty { text-align: center; color: var(--muted); padding: 32px; font-size: 0.9rem; }
    .lb-loading { text-align: center; color: var(--muted); padding: 32px; }
    .spinner {
      display: inline-block;
      width: 20px; height: 20px;
      border: 2px solid rgba(124,111,255,0.3);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .lb-updated { font-size: 0.75rem; color: var(--muted); text-align: right; margin-top: 12px; }

    .footer { text-align: center; font-size: 0.8rem; color: var(--muted); margin-top: 12px; }
  </style>
</head>
<body>

<!-- ══════════════════════════════════════════
     SCREEN 0: Class code
══════════════════════════════════════════ -->
<div id="screen-code" class="screen hidden">
  <div class="header">
    <h1>🇩🇪 Deutsche Zahlen</h1>
    <p>クラスコードを入力してください</p>
  </div>
  <div class="card">
    <label class="name-label">Class Code</label>
    <input type="password" class="name-input" id="code-input"
      placeholder="••••••••" maxlength="30"
      autocomplete="off" onkeydown="codeKey(event)" />
    <button class="btn-primary" onclick="checkCode()">入室する →</button>
    <div class="sync-note" id="code-error"></div>
  </div>
</div>

<!-- ══════════════════════════════════════════
     SCREEN 1: Name entry
══════════════════════════════════════════ -->
<div id="screen-name" class="screen">
  <div class="header">
    <h1>🇩🇪 Deutsche Zahlen</h1>
    <p>1〜10000 のドイツ語スペル練習 + ランキング</p>
  </div>
  <div class="card">
    <label class="name-label">あなたの名前を入力してください</label>
    <input type="text" class="name-input" id="name-input"
      placeholder="例: 田中" maxlength="20"
      autocomplete="off" onkeydown="nameKey(event)" />
    <p class="name-note">この名前でランキングに登録されます</p>
    <button class="btn-primary" id="start-btn" onclick="startGame()">ゲームスタート →</button>
    <div class="sync-note" id="name-error"></div>
  </div>
</div>

<!-- ══════════════════════════════════════════
     SCREEN 2: Game
══════════════════════════════════════════ -->
<div id="screen-game" class="screen hidden">

  <div class="top-bar">
    <div class="player-badge">
      <span>👤</span>
      <strong id="player-label">—</strong>
    </div>
    <button class="rank-btn" onclick="showLeaderboard()">🏆 ランキング</button>
  </div>

  <div class="score-bar">
    <div class="score-item">
      <div class="score-label">累計正解</div>
      <div class="score-value sv-correct" id="sc-correct">—</div>
    </div>
    <div class="score-item">
      <div class="score-label">累計正答率</div>
      <div class="score-value sv-rate" id="sc-rate">—</div>
    </div>
    <div class="score-item">
      <div class="score-label">累計不正解</div>
      <div class="score-value sv-wrong" id="sc-wrong">—</div>
    </div>
    <div class="score-item">
      <div class="score-label">累計問題数</div>
      <div class="score-value" id="sc-total" style="color:var(--text)">—</div>
    </div>
  </div>

  <div class="card">
    <div class="number-display" id="num-display">—</div>
    <div class="number-hint">この数字をドイツ語でスペルしてください</div>

    <button class="speak-btn" id="speak-btn" onclick="speak()">
      <span>🔊</span><span>発音を聞く (auf Deutsch)</span>
    </button>

    <input type="text" class="answer-input" id="ans-input"
      placeholder="例: einundzwanzig"
      autocomplete="off" autocorrect="off" spellcheck="false"
      onkeydown="handleKey(event)" />

    <div class="umlaut-row">
      <div class="umlaut-bar">
        <button class="umlaut-btn" onclick="ins('ä')">ä</button>
        <button class="umlaut-btn" onclick="ins('ö')">ö</button>
        <button class="umlaut-btn" onclick="ins('ü')">ü</button>
        <button class="umlaut-btn" onclick="ins('ß')">ß</button>
      </div>
      <button class="hint-btn" id="hint-btn" onclick="showHint()">💡 ヒント</button>
    </div>

    <button class="btn-primary" id="check-btn" onclick="checkAnswer()">確認する ✓</button>
    <button class="btn-next hidden" id="next-btn" onclick="nextNumber()">次の数字 →</button>
  </div>

  <div class="result-card hidden" id="result-card">
    <div class="result-status" id="result-status"></div>
    <div class="comparison-label">あなたの回答</div>
    <div class="comparison" id="comparison"></div>
    <div class="correct-box hidden" id="correct-box">
      <div class="correct-box-label">正解</div>
      <div class="correct-box-text" id="correct-text"></div>
    </div>
    <div class="legend">
      <span><span class="leg-ok">■</span> 正しい文字</span>
      <span><span class="leg-bad">■</span> 間違った文字</span>
      <span><span class="leg-miss">■</span> 不足している文字</span>
    </div>
  </div>

  <div class="sync-note" id="sync-note"></div>
  <div class="footer">Enterキーで確認 / 次へ進む</div>
</div>

<!-- ══════════════════════════════════════════
     SCREEN 3: Leaderboard
══════════════════════════════════════════ -->
<div id="screen-rank" class="screen hidden">
  <div class="lb-header">
    <h2>🏆 ランキング</h2>
    <div class="lb-actions">
      <button class="btn-icon" onclick="refreshLeaderboard()">🔄 更新</button>
      <button class="btn-icon" onclick="showGame()">← 戻る</button>
    </div>
  </div>

  <div class="card" style="padding: 20px 16px;">
    <div id="lb-content">
      <div class="lb-loading"><div class="spinner"></div><br>読み込み中...</div>
    </div>
    <div class="lb-updated" id="lb-updated"></div>
  </div>
</div>

<script>
// ══════════════════════════════════════════
// Supabase
// ══════════════════════════════════════════
const SUPABASE_URL = 'https://lrumxshmcvywsjkbpcaf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_f151iZgJmikLc24koZ1R0g_tIWA-X3X';
const { createClient } = window.supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

// ══════════════════════════════════════════
// German number → word
// ══════════════════════════════════════════
const ONES = [
  '', 'ein', 'zwei', 'drei', 'vier', 'fünf', 'sechs', 'sieben', 'acht', 'neun',
  'zehn', 'elf', 'zwölf', 'dreizehn', 'vierzehn', 'fünfzehn', 'sechzehn',
  'siebzehn', 'achtzehn', 'neunzehn'
];
const TENS = [
  '', '', 'zwanzig', 'dreißig', 'vierzig', 'fünfzig',
  'sechzig', 'siebzig', 'achtzig', 'neunzig'
];

function below100(n, terminal) {
  if (n === 0) return '';
  if (n < 20) { if (n === 1 && terminal) return 'eins'; return ONES[n]; }
  const one = n % 10, ten = Math.floor(n / 10);
  if (one === 0) return TENS[ten];
  return ONES[one] + 'und' + TENS[ten];
}

function numberToGerman(n) {
  if (n === 0) return 'null';
  if (n === 10000) return 'zehntausend';
  let result = '', rem = n;
  if (rem >= 1000) { const th = Math.floor(rem/1000); rem%=1000; result += (th===1?'ein':ONES[th])+'tausend'; }
  if (rem >= 100)  { const hu = Math.floor(rem/100);  rem%=100;  result += (hu===1?'ein':ONES[hu])+'hundert'; }
  if (rem > 0) result += below100(rem, true);
  return result;
}

// ══════════════════════════════════════════
// Game state
// ══════════════════════════════════════════
let playerName  = '';
let dbCorrect   = 0;   // 過去セッションの累積
let dbTotal     = 0;
let correctCount = 0;  // 今セッション
let wrongCount   = 0;
let currentNumber = null;
let correctWord   = '';
let answered      = false;
let hintLevel     = 0;

// ══════════════════════════════════════════
// Name screen
// ══════════════════════════════════════════
function nameKey(e) { if (e.key === 'Enter') startGame(); }

async function startGame() {
  const raw = document.getElementById('name-input').value.trim();
  if (!raw) { showNameError('名前を入力してください'); return; }

  const btn = document.getElementById('start-btn');
  btn.disabled = true;
  btn.textContent = '接続中...';

  try {
    playerName = raw;
    // 既存スコアを取得
    const { data } = await sb.from('leaderboard')
      .select('correct, total')
      .eq('name', playerName)
      .maybeSingle();
    if (data) { dbCorrect = data.correct; dbTotal = data.total; }

    document.getElementById('player-label').textContent = playerName;
    show('screen-game');
    updateScore();
    nextNumber();
  } catch (err) {
    showNameError('接続エラー: ' + err.message);
    btn.disabled = false;
    btn.textContent = 'ゲームスタート →';
  }
}

function showNameError(msg) {
  const el = document.getElementById('name-error');
  el.textContent = msg;
  el.className = 'sync-note error';
}

// ══════════════════════════════════════════
// Game logic
// ══════════════════════════════════════════
function nextNumber() {
  currentNumber = Math.floor(Math.random() * 10000) + 1;
  correctWord   = numberToGerman(currentNumber);
  answered      = false;
  hintLevel     = 0;

  document.getElementById('num-display').textContent = currentNumber.toLocaleString('de-DE');
  document.getElementById('ans-input').value = '';
  document.getElementById('ans-input').disabled = false;
  document.getElementById('check-btn').classList.remove('hidden');
  document.getElementById('next-btn').classList.add('hidden');
  document.getElementById('result-card').classList.add('hidden');
  document.getElementById('hint-btn').classList.remove('hidden');
  document.getElementById('sync-note').textContent = '';
  document.getElementById('ans-input').focus();
}

function speak() {
  if (!currentNumber) return;
  const btn = document.getElementById('speak-btn');
  const utt = new SpeechSynthesisUtterance(String(currentNumber));
  utt.lang = 'de-DE'; utt.rate = 0.7;
  btn.classList.add('speaking');
  utt.onend = utt.onerror = () => btn.classList.remove('speaking');
  speechSynthesis.cancel();
  speechSynthesis.speak(utt);
}

function speakWord(word) {
  const utt = new SpeechSynthesisUtterance(word);
  utt.lang = 'de-DE'; utt.rate = 0.6;
  speechSynthesis.cancel();
  speechSynthesis.speak(utt);
}

function ins(ch) {
  const inp = document.getElementById('ans-input');
  const s = inp.selectionStart, e = inp.selectionEnd;
  inp.value = inp.value.slice(0, s) + ch + inp.value.slice(e);
  inp.setSelectionRange(s+1, s+1);
  inp.focus();
}

function handleKey(ev) {
  if (ev.key === 'Enter') { if (answered) nextNumber(); else checkAnswer(); }
}

function showHint() {
  hintLevel++;
  const reveal = correctWord.slice(0, hintLevel * 2);
  const inp = document.getElementById('ans-input');
  if (inp.value.length < reveal.length) inp.value = reveal;
  inp.focus();
  if (hintLevel * 2 >= correctWord.length) {
    document.getElementById('hint-btn').classList.add('hidden');
  }
}

async function checkAnswer() {
  if (!currentNumber || answered) return;
  const raw = document.getElementById('ans-input').value.trim();
  if (!raw) return;

  const user    = raw.toLowerCase();
  const correct = correctWord.toLowerCase();
  const isOk    = user === correct;

  if (isOk) correctCount++; else wrongCount++;
  answered = true;

  document.getElementById('ans-input').disabled = true;
  document.getElementById('check-btn').classList.add('hidden');
  document.getElementById('next-btn').classList.remove('hidden');
  document.getElementById('hint-btn').classList.add('hidden');

  // Show result
  const statusEl  = document.getElementById('result-status');
  const compEl    = document.getElementById('comparison');
  const correctBox = document.getElementById('correct-box');
  document.getElementById('result-card').classList.remove('hidden');

  if (isOk) {
    statusEl.textContent = '✅ 正解！Richtig!';
    statusEl.className   = 'result-status rs-correct';
    correctBox.classList.add('hidden');
  } else {
    statusEl.textContent = '❌ 不正解。Falsch!';
    statusEl.className   = 'result-status rs-wrong';
    document.getElementById('correct-text').textContent = correctWord;
    correctBox.classList.remove('hidden');
  }
  compEl.innerHTML = buildComparison(user, correct);

  updateScore();
  setTimeout(() => speakWord(correctWord), 300);
  await saveScore();
}

// ══════════════════════════════════════════
// Supabase score sync
// ══════════════════════════════════════════
async function saveScore() {
  const note = document.getElementById('sync-note');
  note.textContent = '保存中...'; note.className = 'sync-note saving';
  try {
    const { error } = await sb.from('leaderboard').upsert({
      name: playerName,
      correct: dbCorrect + correctCount,
      total:   dbTotal   + correctCount + wrongCount,
      updated_at: new Date().toISOString()
    }, { onConflict: 'name' });

    if (error) throw error;
    note.textContent = '✓ 保存済み'; note.className = 'sync-note saved';
  } catch (err) {
    note.textContent = '⚠ 保存失敗 (オフライン?)'; note.className = 'sync-note error';
    console.error(err);
  }
}

// ══════════════════════════════════════════
// Score display
// ══════════════════════════════════════════
function updateScore() {
  const cumCorrect = dbCorrect + correctCount;
  const cumTotal   = dbTotal + correctCount + wrongCount;
  const cumWrong   = cumTotal - cumCorrect;
  const rate = cumTotal > 0 ? Math.round(cumCorrect / cumTotal * 100) + '%' : '—';
  document.getElementById('sc-correct').textContent = cumCorrect;
  document.getElementById('sc-wrong').textContent   = cumWrong;
  document.getElementById('sc-rate').textContent    = rate;
  document.getElementById('sc-total').textContent   = cumTotal;
}

// ══════════════════════════════════════════
// Comparison builder
// ══════════════════════════════════════════
function buildComparison(user, correct) {
  const maxLen = Math.max(user.length, correct.length);
  let html = '';
  for (let i = 0; i < maxLen; i++) {
    if (i >= user.length)    html += `<span class="ch-miss">${esc(correct[i])}</span>`;
    else if (i >= correct.length) html += `<span class="ch-bad">${esc(user[i])}</span>`;
    else if (user[i] === correct[i]) html += `<span class="ch-ok">${esc(user[i])}</span>`;
    else html += `<span class="ch-bad">${esc(user[i])}</span>`;
  }
  return html || '<span style="color:var(--muted)">(空欄)</span>';
}
function esc(ch) { return ch.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ══════════════════════════════════════════
// Leaderboard
// ══════════════════════════════════════════
async function showLeaderboard() {
  show('screen-rank');
  await refreshLeaderboard();
}

async function refreshLeaderboard() {
  const content = document.getElementById('lb-content');
  content.innerHTML = '<div class="lb-loading"><div class="spinner"></div><br>読み込み中...</div>';

  try {
    const { data, error } = await sb
      .from('leaderboard')
      .select('name, correct, total, updated_at')
      .order('correct', { ascending: false })
      .limit(20);

    if (error) throw error;

    if (!data || data.length === 0) {
      content.innerHTML = '<div class="lb-empty">まだ記録がありません。<br>最初のプレイヤーになろう！</div>';
      return;
    }

    const medals = ['🥇','🥈','🥉'];
    const medalClasses = ['medal-1','medal-2','medal-3'];

    let rows = data.map((row, i) => {
      const rate = row.total > 0 ? Math.round(row.correct / row.total * 100) : 0;
      const rank = i + 1;
      const rankDisplay = rank <= 3
        ? `<span class="${medalClasses[i]}">${medals[i]}</span>`
        : `<span style="color:var(--muted)">${rank}</span>`;
      const isMe = row.name === playerName ? ' class="me"' : '';
      const nameSuffix = row.name === playerName ? ' <span style="color:var(--accent);font-size:0.75rem">あなた</span>' : '';

      return `<tr${isMe}>
        <td class="rank-cell">${rankDisplay}</td>
        <td class="name-cell">${esc(row.name)}${nameSuffix}</td>
        <td class="correct-cell">${row.correct}</td>
        <td class="total-cell">${row.total}</td>
        <td class="rate-cell">${rate}%</td>
      </tr>`;
    }).join('');

    content.innerHTML = `
      <table class="lb-table">
        <thead>
          <tr>
            <th>#</th>
            <th>名前</th>
            <th>正解数</th>
            <th>問題数</th>
            <th>正答率</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>`;

    document.getElementById('lb-updated').textContent =
      '最終更新: ' + new Date().toLocaleTimeString('ja-JP');

  } catch (err) {
    content.innerHTML = `<div class="lb-empty">読み込みエラー: ${err.message}</div>`;
  }
}

function showGame() { show('screen-game'); }

// ══════════════════════════════════════════
// Screen helper
// ══════════════════════════════════════════
function show(id) {
  ['screen-code','screen-name','screen-game','screen-rank'].forEach(s => {
    document.getElementById(s).classList.toggle('hidden', s !== id);
  });
  window.scrollTo(0, 0);
}

// ══════════════════════════════════════════
// Class code gate
// ══════════════════════════════════════════
const CLASS_CODE = 'deutsch';
const CODE_KEY   = 'dzahl_unlocked';

function codeKey(e) { if (e.key === 'Enter') checkCode(); }

function checkCode() {
  const val = document.getElementById('code-input').value.trim().toLowerCase();
  if (val === CLASS_CODE) {
    localStorage.setItem(CODE_KEY, '1');
    show('screen-name');
    document.getElementById('name-input').focus();
  } else {
    const el = document.getElementById('code-error');
    el.textContent = 'コードが違います';
    el.className = 'sync-note error';
    document.getElementById('code-input').value = '';
    document.getElementById('code-input').focus();
  }
}

// ══════════════════════════════════════════
// Init
// ══════════════════════════════════════════
if (localStorage.getItem(CODE_KEY) === '1') {
  show('screen-name');
  document.getElementById('name-input').focus();
} else {
  show('screen-code');
  document.getElementById('code-input').focus();
}
</script>
